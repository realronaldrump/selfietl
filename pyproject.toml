[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "selfietl"
version = "0.1.0"
description = "Local-first selfie timelapse alignment, morphing, and export app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.136.1",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "numpy>=1.26",
  "scipy>=1.13",
  "pillow>=10.4",
  "piexif>=1.1.3",
  "ImageHash>=4.3.1",
  "ffmpeg-python>=0.2.0",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
full = [
  "mediapipe>=0.10.14",
  "opencv-python>=4.10",
  "scikit-image>=0.24",
  "pillow-heif>=0.18",
  "librosa>=0.10",
]
dev = [
  "pytest>=8.3",
  "httpx2",
]

[project.scripts]
selfietl = "selfietl.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["selfietl"]
